name: Minimum CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bootstrap documents and relative links
        shell: bash
        run: |
          python3 -I -B - <<'PYCODE'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          names = [name for name in names if name]
          if not names:
              raise SystemExit('Empty repository inventory')
          documents = [name for name in names if name.endswith('.md')]
          if not documents:
              raise SystemExit('No documents checked')
          for name in names:
              path = root / name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('Expected regular tracked file: ' + name)
              text = path.read_text(encoding='ascii')
              if not text.strip():
                  raise SystemExit('Empty tracked file: ' + name)
              if name.endswith('.json'):
                  json.loads(text)
          for name in documents:
              path = root / name
              text = path.read_text(encoding='ascii')
              if not re.search(r'^# .+', text, re.MULTILINE):
                  raise SystemExit('Missing document heading: ' + name)
              for link in re.findall(r'\[[^\]]+\]\(([^)]+)\)', text):
                  if '://' not in link and not link.startswith('#'):
                      target = link.split('#', 1)[0]
                      if target and not (path.parent / target).is_file():
                          raise SystemExit('Broken relative link: ' + link)
          readme = (root / 'README.md').read_text(encoding='ascii')
          if 'No implementation is included' not in readme:
              raise SystemExit('Bootstrap implementation status must remain explicit')
          print(f'Validated {len(names)} tracked files and {len(documents)} documents')
          PYCODE

  license:
    name: License policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify latest stable license checker artifact
        uses: i-pp/license-check-ci@f6f00d79e73562ae7d200abac986b2e9ce72252d

  minimum_ci:
    name: Minimum CI
    needs: [documents, license]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all minimum checks to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.documents.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LICENSE_RESULT" = success
